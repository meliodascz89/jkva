[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jkva/jkva"
homepage = "https://jkva.dev"
authors = ["JKva contributors"]

[workspace.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1

[profile.bench]
lto = "thin"
codegen-units = 1
