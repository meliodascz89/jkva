[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/meliodascz89/jkva"
homepage = "https://github.com/meliodascz89/jkva"
authors = ["JKva contributors"]

[workspace.dependencies]
png = "0.17"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
serde_json = "1"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1

[profile.bench]
lto = "thin"
codegen-units = 1
