<!doctype html>
<html>
<head>
<style>
body { margin: 24px; font-size: 15px; color: #1b1b1b; }
h2 { font-size: 1.4em; color: #0b3d91; margin: 0 0 8px 0; }
.card { background-color: #f4f6fa; padding: 16px; margin: 0 0 16px 0; width: 360px; }
p { margin: 0; }
.muted { color: #6b7280; }
</style>
</head>
<body>
<h2>Wrapping</h2>
<div class="card"><p>This paragraph is narrow on purpose so the line breaker has to wrap it into several lines inside the card.</p></div>
<h2>Colors</h2>
<div class="card"><p class="muted">Muted text on a light card.</p><p>Inline <code>monospace</code> text in a paragraph.</p></div>
</body>
</html>
