<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Flexbox</title>
    <style>
      body { margin: 16px; font-family: "Helvetica"; color: #111827; }
      h1 { font-size: 22px; margin: 0 0 10px 0; color: #1d4ed8; }
      h2 { font-size: 16px; margin: 14px 0 6px 0; }
      .row { display: flex; gap: 16px; justify-content: space-between; align-items: center; height: 60px; }
      .card { background-color: #eef2ff; padding: 8px; border: 1px solid #6366f1; }
      .center { display: flex; gap: 8px; justify-content: center; align-items: center; height: 40px; }
      .pill { background-color: #fde68a; padding: 4px 8px; }
      .end { align-self: flex-end; }
      .mid { align-self: center; }
      .column { display: flex; flex-direction: column; gap: 6px; }
      .bar { background-color: #dbeafe; padding: 4px 8px; }
      .wrap { display: flex; flex-wrap: wrap; gap: 12px; }
      .tile { flex-basis: 160px; flex-grow: 1; background-color: #dcfce7; padding: 8px; }
      .ordered { display: flex; gap: 8px; }
      .ordered > div { background-color: #f3e8ff; padding: 4px 8px; }
      .o2 { order: 2; }
      .o0 { order: 0; }
      .o1 { order: 1; }
      .ac { display: flex; flex-wrap: wrap; align-content: space-between; height: 80px; gap: 6px; }
      .ac > div { width: 45%; background-color: #e0f2fe; padding: 6px; }
    </style>
  </head>
  <body>
    <h1>Flexbox</h1>
    <h2>Row, space-between, stretch</h2>
    <div class="row">
      <div class="card">One</div>
      <div class="card mid">Two</div>
      <div class="card end">Three</div>
    </div>
    <h2>Row, centre</h2>
    <div class="center">
      <span class="pill">alpha</span>
      <span class="pill">beta</span>
      <span class="pill">gamma</span>
    </div>
    <h2>Wrap and grow</h2>
    <div class="wrap">
      <div class="tile">one</div>
      <div class="tile">two</div>
      <div class="tile">three</div>
      <div class="tile">four</div>
      <div class="tile">five</div>
    </div>
    <h2>Order</h2>
    <div class="ordered">
      <div class="o2">A (order 2)</div>
      <div class="o0">B (order 0)</div>
      <div class="o1">C (order 1)</div>
    </div>
    <h2>Align-content</h2>
    <div class="ac">
      <div>line one A</div>
      <div>line one B</div>
      <div>line two A</div>
      <div>line two B</div>
    </div>
  </body>
</html>
